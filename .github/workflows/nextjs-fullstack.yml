name: Reusable Next.js Fullstack Docs/API

on:
  workflow_call:
    inputs:
      node_version:
        required: false
        type: string
        default: "20"
      docs_route:
        required: false
        type: string
        default: "/docs"
      api_health_route:
        required: false
        type: string
        default: "/api/health"
      app_port:
        required: false
        type: number
        default: 3000
      retry_count:
        required: false
        type: number
        default: 60
      retry_sleep_seconds:
        required: false
        type: number
        default: 2
      startup_probe_delay_seconds:
        required: false
        type: number
        default: 1

jobs:
  validate-docs-and-api:
    name: Validate Docs UI and API Endpoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build

      - name: Start application and verify docs/API routes
        env:
          PORT: ${{ inputs.app_port }}
          DOCS_ROUTE: ${{ inputs.docs_route }}
          API_HEALTH_ROUTE: ${{ inputs.api_health_route }}
          RETRY_COUNT: ${{ inputs.retry_count }}
          RETRY_SLEEP: ${{ inputs.retry_sleep_seconds }}
          STARTUP_PROBE_DELAY: ${{ inputs.startup_probe_delay_seconds }}
        run: |
          APP_LOG=nextjs-app.log
          APP_HOST=127.0.0.1

          if ! npm run | grep -qE '^[[:space:]]+start'; then
            echo "Missing required npm script: start"
            exit 1
          fi

          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            sleep 1
            kill -9 "$APP_PID" 2>/dev/null || true
          }

          export HOSTNAME="$APP_HOST"
          npm run start >"$APP_LOG" 2>&1 &
          APP_PID=$!
          trap cleanup EXIT
          sleep "$STARTUP_PROBE_DELAY"

          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "Next.js app failed to start. Logs:"
            cat "$APP_LOG"
            exit 1
          fi

          wait_for_route() {
            local route="$1"
            local ready_message="$2"
            local failed_message="$3"

            for i in $(seq 1 "$RETRY_COUNT"); do
              if curl -fsS "http://127.0.0.1:$PORT$route" >/dev/null; then
                echo "$ready_message"
                return 0
              fi
              if [ "$i" -eq "$RETRY_COUNT" ]; then
                echo "$failed_message"
                echo "App logs:"
                cat "$APP_LOG"
                return 1
              fi
              sleep "$RETRY_SLEEP"
            done
          }

          wait_for_route "$DOCS_ROUTE" "Docs route is ready: $DOCS_ROUTE" "Route check failed: $DOCS_ROUTE" || exit 1
          wait_for_route "$API_HEALTH_ROUTE" "API health route is ready: $API_HEALTH_ROUTE" "Route check failed: $API_HEALTH_ROUTE" || exit 1
